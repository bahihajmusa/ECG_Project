    operation: Conv1d
    kernel_size: 5
  # Layer 2: conv3 (32 -> 32 channels)
  - max_pool: 2
    pool_stride: 2
    pad: 2
    activate: ReLU
    out_offset: 0x2000
    processors: 0x00000000ffffffff
    operation: Conv1d
    kernel_size: 5
  # Layer 3: conv4 (32 -> 48 channels)
  - max_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x0000
    processors: 0x00000000ffffffff
    operation: Conv1d
    kernel_size: 3
  # Layer 4: conv5 (48 -> 64 channels)
  - max_pool: 2
    pool_stride: 2
    pad: 1
    activate: ReLU
    out_offset: 0x2000
    processors: 0x0000ffffffffffff
    operation: Conv1d
